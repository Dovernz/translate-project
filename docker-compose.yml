services:
  geminitrans:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geminitrans_app
    restart: unless-stopped
    ports:
      - "${TRANSLATE_PORT:-8090}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./templates:/app/templates
      - ./core:/app/core
      - ./app.py:/app/app.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/pool-status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
