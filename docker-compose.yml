services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geminitrans_backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./templates:/app/templates
      - ./core:/app/core
      - ./app.py:/app/app.py
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/pool-status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - gemini_net

  nginx:
    image: nginx:alpine
    container_name: geminitrans_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRANSLATE_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - gemini_net

networks:
  gemini_net:
    driver: bridge
