# Cấu hình Nginx Reverse Proxy tối ưu cho GeminiTrans
# Đặt file này tại: /etc/nginx/sites-available/geminitrans
# Sau đó tạo symlink: ln -s /etc/nginx/sites-available/geminitrans /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com; # Thay bằng tên miền của bạn hoặc IP VPS

    # Cho phép upload video kích thước lớn (lên tới 500MB)
    client_max_body_size 500M;

    # Tối ưu gzip nén tài nguyên tĩnh
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Forward các header nhận diện client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ Server-Sent Events (SSE) và Streaming dịch thuật thời gian thực
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Tăng timeout xử lý cho các video dài và nhận diện âm thanh
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
