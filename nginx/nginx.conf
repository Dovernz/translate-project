server {
    listen 80;
    server_name localhost;

    # Cho phép tải video/tệp đa phương tiện lớn lên tới 500MB
    client_max_body_size 500M;

    # Tối ưu gzip nén tài nguyên tĩnh
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Header proxy chuyển tiếp nhận diện client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ SSE (Server-Sent Events) Streaming thời gian thực - tắt buffer
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeout dài cho xử lý tác vụ dịch thuật và nhận diện âm thanh
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
