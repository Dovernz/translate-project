    <!-- TAB 4: AUDIO TRANSCRIBE & VOICE -->
    <!-- ========================================== -->
    <section id="tab-transcribe" class="space-y-4 hidden">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="rounded-[10px] bg-slate-900 border border-slate-800 p-5 flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-base mb-3 flex items-center gap-2">
              <i data-lucide="mic" class="w-5 h-5 text-indigo-400"></i> <span data-i18n="transcribe_title">Ghi âm hoặc tải file</span>
            </h3>

            <div class="text-center py-6 bg-slate-950/60 rounded-[8px] border border-slate-800/80 mb-4">
              <button id="btn-record" onclick="toggleRecord()" class="w-16 h-16 rounded-[8px] bg-red-500/20 text-red-400 border border-red-500/30 hover:scale-105 active:scale-95 flex items-center justify-center mx-auto transition shadow-lg shadow-red-500/10 cursor-pointer">
                <i data-lucide="mic" id="record-icon" class="w-7 h-7"></i>
              </button>
              <p id="record-status" class="text-xs text-slate-400 mt-3 font-medium" data-i18n="record_idle">Bấm micro để bắt đầu nói</p>
              <p id="record-timer" class="text-xs text-slate-500 font-mono mt-0.5">00:00</p>
            </div>

            <div class="text-center">
              <span class="text-xs text-slate-500 block mb-2" data-i18n="record_or">- hoặc -</span>
              <label class="cursor-pointer block w-full py-2.5 px-4 rounded-[8px] bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-xs text-slate-300 font-medium transition">
                <i data-lucide="upload-cloud" class="w-4 h-4 inline mr-1.5"></i> <span data-i18n="btn_audio_file">Chọn file âm thanh</span>
                <input type="file" id="audio-file-input" class="hidden" accept="audio/*" onchange="handleAudioUpload(event)">
              </label>
              <p id="audio-file-name" class="text-[11px] text-indigo-400 mt-2 truncate font-mono"></p>
            </div>
          </div>

          <button onclick="startTranscribe()" id="btn-start-transcribe" class="w-full py-2.5 rounded-[8px] bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20 mt-4 transition cursor-pointer">
            <i data-lucide="mic" class="w-4 h-4"></i> <span data-i18n="btn_start_transcribe">Phân tích âm thanh</span>
          </button>
        </div>

        <div class="md:col-span-2 rounded-[10px] bg-slate-900 border border-slate-800 p-5 flex flex-col h-[520px] sm:h-[580px] lg:h-[620px]">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-2">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i data-lucide="file-audio" class="w-3.5 h-3.5 text-indigo-400"></i> <span data-i18n="transcribe_result_title">Kết quả phiên âm</span>
            </span>
            <button onclick="copyTranscribeText()" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 flex items-center gap-1 transition">
              <i data-lucide="copy" class="w-3 h-3"></i> <span data-i18n="btn_copy">Sao chép</span>
            </button>
          </div>
          <div id="transcribe-output" class="flex-1 overflow-y-auto text-slate-200 text-sm leading-relaxed whitespace-pre-wrap select-text p-2">
            <span class="text-slate-600 italic" data-i18n="transcribe_placeholder">Kết quả nhận diện giọng nói và bản dịch sẽ hiển thị tại đây...</span>
          </div>
        </div>
      </div>
    </section>
