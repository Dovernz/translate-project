    <!-- TAB 2: DOCUMENT & TEXT TRANSLATOR (FORMAT-PRESERVED) -->
    <!-- ========================================== -->
    
    
    <section id="tab-document" class="hidden space-y-6">
        <!-- Toolbar -->
        <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 flex flex-wrap items-center gap-4">
            <div class="flex items-center gap-2">
                <select id="doc-source-lang" class="bg-slate-900 border-slate-700 text-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="auto">Phát hiện ngôn ngữ</option>
                    <option value="en">Tiếng Anh</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="zh">Tiếng Trung</option>
                    <option value="ja">Tiếng Nhật</option>
                </select>
                <button id="doc-swap-lang" class="p-2 hover:bg-slate-700 rounded-full transition-colors text-slate-400">
                    <i data-lucide="arrow-right-left" class="w-5 h-5"></i>
                </button>
                <select id="doc-target-lang" class="bg-slate-900 border-slate-700 text-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="vi">Tiếng Việt</option>
                    <option value="en">Tiếng Anh</option>
                    <option value="zh">Tiếng Trung</option>
                    <option value="ja">Tiếng Nhật</option>
                </select>
            </div>
            
            <div class="h-8 w-px bg-slate-700 hidden md:block"></div>

            <select id="doc-model-tier" class="bg-slate-900 border-slate-700 text-slate-200 rounded-lg px-3 py-2 outline-none">
                <option value="bulk">Mô hình: Bulk (Nhanh)</option>
                <option value="standard" selected>Mô hình: Standard</option>
                <option value="ultra">Mô hình: Ultra (Tốt nhất)</option>
                <option value="deep">Mô hình: Deep Research</option>
            </select>

            <label class="flex items-center gap-2 cursor-pointer group">
                <input type="checkbox" id="doc-live-sync" checked class="w-4 h-4 rounded border-slate-700 text-indigo-600 focus:ring-indigo-500 bg-slate-900">
                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Tự động dịch khi gõ (Live Sync)</span>
            </label>

            <div class="flex-grow"></div>

            <button id="doc-translate-now" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-xl font-medium transition-all flex items-center gap-2 shadow-lg shadow-indigo-500/20">
                <i data-lucide="languages" class="w-4 h-4"></i>
                Dịch ngay
            </button>
            <span id="doc-status" class="text-xs font-medium px-3 py-1 rounded-full bg-slate-700 text-slate-300 border border-slate-600">Sẵn sàng</span>
        </div>

        <!-- Dropzone -->
        <div id="doc-dropzone" class="relative group border-2 border-dashed border-slate-700 hover:border-indigo-500/50 rounded-2xl p-4 transition-all bg-slate-800/20 hover:bg-slate-800/40 cursor-pointer text-center">
            <input type="file" id="doc-file-input" class="hidden" accept=".docx,.pdf,.srt,.md,.txt">
            <div id="doc-file-badge" class="hidden inline-flex items-center gap-2 bg-indigo-500/10 text-indigo-400 px-4 py-2 rounded-full border border-indigo-500/20 mb-2">
                <i data-lucide="file-text" class="w-4 h-4"></i>
                <span id="doc-file-info" class="text-sm font-medium"></span>
                <button id="doc-remove-file" class="hover:text-red-400 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div id="doc-upload-prompt" class="flex flex-col items-center">
                <p class="text-slate-400 text-sm">Kéo thả hoặc nhấp để nạp tệp (.docx, .pdf, .srt, .md, .txt)</p>
            </div>
        </div>

        <!-- Dual Editor -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Source Column -->
            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center px-1">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="edit-3" class="w-3 h-3"></i> VĂN BẢN GỐC (CHỈNH SỬA TRỰC TIẾP)
                    </h3>
                    <span id="doc-source-counter" class="text-[10px] text-slate-500 font-mono bg-slate-800 px-2 py-0.5 rounded">0 ký tự</span>
                </div>
                <div id="doc-source-editor" contenteditable="true" class="doc-canvas w-full min-h-[560px] max-h-[750px] overflow-y-auto bg-slate-900 border border-slate-800 text-slate-100 p-6 rounded-2xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none leading-relaxed transition-all" data-placeholder="Nhập nội dung, dán văn bản có bảng biểu, hoặc kéo thả tệp vào đây..."></div>
            </div>

            <!-- Target Column -->
            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center px-1">
                    <div class="flex items-center gap-3">
                        <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="sparkles" class="w-3 h-3"></i> BẢN DỊCH TƯƠNG TÁC (CHỈNH SỬA TỰ DO)
                        </h3>
                        <span class="text-[10px] bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded border border-indigo-500/20">Đồng bộ một chiều</span>
                    </div>
                    <span id="doc-target-counter" class="text-[10px] text-slate-500 font-mono bg-slate-800 px-2 py-0.5 rounded">0 ký tự</span>
                </div>
                <div id="doc-target-editor" contenteditable="true" class="doc-canvas w-full min-h-[560px] max-h-[750px] overflow-y-auto bg-slate-900 border border-slate-800 text-slate-100 p-6 rounded-2xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none leading-relaxed transition-all" data-placeholder="Bản dịch trực quan sẽ xuất hiện ở đây..."></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-slate-800">
            <div class="flex gap-2">
                <button id="doc-clear-all" class="flex items-center gap-2 px-4 py-2 text-sm text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-all">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Xóa toàn bộ
                </button>
                <button id="doc-copy-target" class="flex items-center gap-2 px-4 py-2 text-sm text-indigo-400 hover:bg-indigo-500/10 rounded-lg transition-all">
                    <i data-lucide="copy" class="w-4 h-4"></i> Sao chép bản dịch
                </button>
            </div>
            
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-500 mr-2">Tải về:</span>
                <div class="flex bg-slate-800 rounded-lg p-1 gap-1">
                    <button onclick="exportDoc('docx')" class="px-3 py-1.5 text-xs hover:bg-slate-700 rounded transition-colors text-slate-300">.DOCX</button>
                    <button onclick="exportDoc('pdf')" class="px-3 py-1.5 text-xs hover:bg-slate-700 rounded transition-colors text-slate-300">.PDF</button>
                    <button onclick="exportDoc('txt')" class="px-3 py-1.5 text-xs hover:bg-slate-700 rounded transition-colors text-slate-300">.TXT</button>
                    <button onclick="exportDoc('srt')" class="px-3 py-1.5 text-xs hover:bg-slate-700 rounded transition-colors text-slate-300">.SRT</button>
                    <button onclick="exportDoc('md')" class="px-3 py-1.5 text-xs hover:bg-slate-700 rounded transition-colors text-slate-300">.MD</button>
                </div>
            </div>
        </div>
    </section>
